<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E7D56">
<meta name="color-scheme" content="light">
<meta name="description" content="ScrapHub — connect households, local scrap vendors and recycling factories.">
<title>ScrapHub</title>
<link rel="icon" type="image/png" href="assets/mark.png">
<link rel="apple-touch-icon" href="assets/mark.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ?v= is bumped on every release so browsers never serve a stale bundle -->
<link rel="stylesheet" href="styles.css?v=4.0.0">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div id="boot" class="boot"><div class="boot-in"><img class="boot-logo" src="assets/mark.png" alt="ScrapHub" width="56" height="56"><div class="spinner"></div><p>Starting ScrapHub…</p></div></div>

<div id="root" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div class="main">
    <header id="topbar" class="topbar"></header>
    <div id="banner"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="js/icons.js?v=4.0.0"></script>
<script src="js/core.js?v=4.0.0"></script>
<script src="js/auth.js?v=4.0.0"></script>
<script src="js/services.js?v=4.0.0"></script>
<script src="js/pricing.js?v=4.0.0"></script>
<script src="js/subscriptions.js?v=4.0.0"></script>
<script src="js/ui.js?v=4.0.0"></script>
<script src="js/portals.js?v=4.0.0"></script>
<script src="js/transport.js?v=4.0.0"></script>
<script src="js/transport-actions.js?v=4.0.0"></script>
<script src="js/chatbot.js?v=4.0.0"></script>
<script src="js/admin.js?v=4.0.0"></script>
<script src="js/app.js?v=4.0.0"></script>
</body>
</html>
