<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16A34A">
<meta name="color-scheme" content="light">
<title>ScrapDaddy — ScrapHub</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="brand" data-act="goHome" aria-label="ScrapDaddy home"><span class="logo">♻️</span><span>Scrap<b>Daddy</b><small>.in · ScrapHub</small></span></button>
  <nav id="roles" class="roles" aria-label="Switch portal"></nav>
  <div class="tools">
    <button class="btn ghost sm" data-act="toggleRates" aria-expanded="false">📈 Live rates</button>
    <button class="btn ghost sm" data-act="reset">↺ Reset Demo Data</button>
  </div>
</header>
<div id="ticker" class="ticker" aria-label="Live scrap rates"></div>
<section id="drawer" class="drawer" hidden></section>
<main id="app"></main>
<footer class="foot">
  <div>♻️ ScrapDaddy.in — a managed circular-economy marketplace for India. Demo build: all data is stored in your browser.</div>
</footer>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
